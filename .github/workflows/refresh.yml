name: refresh-korea-semis

# Every 3 hours, cron is UTC. KR market: 00:00-06:30 UTC. PT: subtract 7-8 hours from UTC.
# 0 */3 * * * = midnight, 3am, 6am, 9am, 12pm, 3pm, 6pm, 9pm UTC
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:  # manual trigger button in Actions UI

permissions:
  contents: write  # needed to commit refreshed data back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python pipeline/run.py

      - name: Commit refreshed data
        run: |
          git config user.name "korea-semis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history/*.json || true
          git diff --quiet --staged || git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
